name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-24.04
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Tag runs can only read caches from their own ref or the default
      # branch, so a cache saved here is never restorable by a later release:
      # skip the (large) save and only restore the cache CI saves on main
      # under the same shared-key. macOS/Windows miss (key includes the OS)
      # and the restore is a fast no-op there.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: oxidemd
          save-if: false

      - name: Install Node dependencies
        run: npm ci

      # Compose the draft release body from the tag's CHANGELOG.md section
      # (tagline + section + install footer, matching the published releases).
      # Falls back to a bare CHANGELOG link if the section is missing, so a
      # forgotten changelog entry can't fail the release.
      - name: Compose release notes from the changelog
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SECTION="$(awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 {found=1; next}
            /^## \[/ {found=0}
            found' CHANGELOG.md | sed 's/^### /## /')"
          {
            echo "body<<NOTES_EOF"
            if [ -z "${SECTION//[[:space:]]/}" ]; then
              echo "::warning::No CHANGELOG.md section found for ${VERSION}" >&2
              echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for details."
            else
              echo "OxideMD ${VERSION} — a native, browser-free Markdown viewer and editor for Windows, Linux, and macOS."
              echo "$SECTION"
              echo ""
              echo "---"
              echo ""
              echo "**Install:** add the apt/dnf repo from the [install page](https://fenrirthegray.github.io/OxideMD/) for automatic updates, or download the installer for your platform below. Arch-based users can install \`oxidemd-bin-${VERSION}-1-x86_64.pkg.tar.zst\` with \`sudo pacman -U\`. See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for full history."
            fi
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "OxideMD v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Hand the Linux .deb to the Arch packaging job (oxidemd-bin repackages it).
      - name: Stash Linux .deb for Arch packaging
        if: matrix.platform == 'ubuntu-24.04'
        uses: actions/upload-artifact@v7
        with:
          name: oxidemd-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 1  # only consumed by the arch-package job below

  arch-package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Presence of this secret gates the PKGBUILD-sync flow below.
      APP_ID: ${{ secrets.PKGBUILD_SYNC_APP_ID }}
    container:
      image: archlinux:latest
    steps:
      # Install before checkout: the checkout action needs git in the container.
      - name: Install build tooling
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git nodejs npm rust \
            webkit2gtk-4.1 gtk3 librsvg \
            pacman-contrib github-cli

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history so the sync step's branch push isn't a shallow update

      # The build step chowns the workspace to the unprivileged builder, so
      # later root-run git/gh calls would trip git's dubious-ownership guard.
      # Mark it safe once (persists in /root/.gitconfig for the whole job).
      - name: Trust workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download Linux .deb
        uses: actions/download-artifact@v8
        with:
          name: oxidemd-deb
          path: deb-artifact

      - name: Build Arch packages
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DEB="$(ls deb-artifact/*.deb | head -1)"
          # makepkg refuses to run as root; build as an unprivileged user.
          useradd -m builder
          chown -R builder:builder .
          runuser -u builder -- bash packaging/aur/ci-build.sh "$VERSION" "$DEB"

      - name: Upload packages to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" arch-dist/*.pkg.tar.zst --clobber

      # Keep the in-repo PKGBUILDs (used by repo/AUR builders) in sync with the
      # released version, with real checksums. The default GITHUB_TOKEN can't
      # push to main (GitHub bars the Actions bot from bypassing the branch's
      # pull-request rule), so mint a short-lived token from a GitHub App that
      # is in main's ruleset bypass list. Runs last so a failure here never
      # strips the release of its artifacts. If the App isn't configured (no
      # PKGBUILD_SYNC_APP_ID) both steps skip and the release still succeeds.
      - name: Generate PKGBUILD-sync token
        id: sync-token
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PKGBUILD_SYNC_APP_ID }}
          private-key: ${{ secrets.PKGBUILD_SYNC_APP_PRIVATE_KEY }}

      - name: Sync committed PKGBUILDs to main
        if: env.APP_ID != ''
        env:
          SYNC_TOKEN: ${{ steps.sync-token.outputs.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DEB="$(ls deb-artifact/*.deb | head -1)"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # Discard the tag checkout + build-time pkgver edits, start from main's tip.
          git checkout -f -B sync-pkgbuild origin/main
          chown -R builder:builder packaging/aur
          runuser -u builder -- bash packaging/aur/update-pkgbuild.sh "$VERSION" "$DEB"
          if git diff --quiet -- packaging/aur; then
            echo "PKGBUILDs already in sync; nothing to do."
            exit 0
          fi
          git add packaging/aur/oxidemd/PKGBUILD packaging/aur/oxidemd/.SRCINFO \
                  packaging/aur/oxidemd-bin/PKGBUILD packaging/aur/oxidemd-bin/.SRCINFO
          git commit -m "chore: sync Arch PKGBUILDs to ${VERSION}"
          # The App token (a bypass actor) pushes directly; Actions masks it in
          # logs. HEAD:main fast-forwards main by this one commit.
          git push "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
