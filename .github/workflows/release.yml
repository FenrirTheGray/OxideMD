name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-24.04
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "OxideMD v__VERSION__"
          releaseBody: "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Hand the Linux .deb to the Arch packaging job (oxidemd-bin repackages it).
      - name: Stash Linux .deb for Arch packaging
        if: matrix.platform == 'ubuntu-24.04'
        uses: actions/upload-artifact@v7
        with:
          name: oxidemd-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  arch-package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:latest
    steps:
      # Install before checkout: the checkout action needs git in the container.
      - name: Install build tooling
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git nodejs npm rust \
            webkit2gtk-4.1 gtk3 librsvg \
            pacman-contrib github-cli

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history so the sync step's branch push isn't a shallow update

      # The build step chowns the workspace to the unprivileged builder, so
      # later root-run git/gh calls would trip git's dubious-ownership guard.
      # Mark it safe once (persists in /root/.gitconfig for the whole job).
      - name: Trust workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download Linux .deb
        uses: actions/download-artifact@v8
        with:
          name: oxidemd-deb
          path: deb-artifact

      - name: Build Arch packages
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DEB="$(ls deb-artifact/*.deb | head -1)"
          # makepkg refuses to run as root; build as an unprivileged user.
          useradd -m builder
          chown -R builder:builder .
          runuser -u builder -- bash packaging/aur/ci-build.sh "$VERSION" "$DEB"

      - name: Upload packages to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" arch-dist/*.pkg.tar.zst --clobber

      # Keep the in-repo PKGBUILDs (used by repo/AUR builders) in sync with the
      # released version, with real checksums. Pushes straight to main using a
      # PAT (secrets.PKGBUILD_SYNC_TOKEN) that can bypass the branch's
      # pull-request rule; runs last so a failure here never strips the release
      # of its artifacts. If the token is absent the step is a no-op.
      - name: Sync committed PKGBUILDs to main
        env:
          SYNC_TOKEN: ${{ secrets.PKGBUILD_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo "::warning::PKGBUILD_SYNC_TOKEN is not set; skipping the PKGBUILD sync."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          DEB="$(ls deb-artifact/*.deb | head -1)"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # Discard the tag checkout + build-time pkgver edits, start from main's tip.
          git checkout -f -B sync-pkgbuild origin/main
          chown -R builder:builder packaging/aur
          runuser -u builder -- bash packaging/aur/update-pkgbuild.sh "$VERSION" "$DEB"
          if git diff --quiet -- packaging/aur; then
            echo "PKGBUILDs already in sync; nothing to do."
            exit 0
          fi
          git add packaging/aur/oxidemd/PKGBUILD packaging/aur/oxidemd/.SRCINFO \
                  packaging/aur/oxidemd-bin/PKGBUILD packaging/aur/oxidemd-bin/.SRCINFO
          git commit -m "chore: sync Arch PKGBUILDs to ${VERSION}"
          # The token (acting as a maintainer with bypass) pushes directly; Actions
          # masks it in logs. HEAD:main fast-forwards main by this one commit.
          git push "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
