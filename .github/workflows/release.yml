name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "OxideMD v__VERSION__"
          releaseBody: "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Hand the Linux .deb to the Arch packaging job (oxidemd-bin repackages it).
      - name: Stash Linux .deb for Arch packaging
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: oxidemd-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  arch-package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    container:
      image: archlinux:latest
    steps:
      # Install before checkout: the checkout action needs git in the container.
      - name: Install build tooling
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git nodejs npm rust \
            webkit2gtk-4.1 gtk3 librsvg \
            pacman-contrib github-cli

      - uses: actions/checkout@v6

      - name: Download Linux .deb
        uses: actions/download-artifact@v4
        with:
          name: oxidemd-deb
          path: deb-artifact

      - name: Build Arch packages
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DEB="$(ls deb-artifact/*.deb | head -1)"
          # makepkg refuses to run as root; build as an unprivileged user.
          useradd -m builder
          chown -R builder:builder .
          runuser -u builder -- bash packaging/aur/ci-build.sh "$VERSION" "$DEB"

      - name: Upload packages to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" arch-dist/*.pkg.tar.zst --clobber

      # Keep the in-repo PKGBUILDs (used by repo/AUR builders) in sync with the
      # released version, with real checksums. Opens a PR rather than pushing to
      # main (which is protected); runs last so a failure here never strips the
      # release of its artifacts.
      - name: Sync committed PKGBUILDs via PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DEB="$(ls deb-artifact/*.deb | head -1)"
          BRANCH="chore/sync-pkgbuild-${VERSION}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # Discard the tag checkout + build-time pkgver edits, branch off main.
          git checkout -f -B "$BRANCH" origin/main
          chown -R builder:builder packaging/aur
          runuser -u builder -- bash packaging/aur/update-pkgbuild.sh "$VERSION" "$DEB"
          if git diff --quiet -- packaging/aur; then
            echo "PKGBUILDs already in sync; nothing to do."
            exit 0
          fi
          git add packaging/aur/oxidemd/PKGBUILD packaging/aur/oxidemd/.SRCINFO \
                  packaging/aur/oxidemd-bin/PKGBUILD packaging/aur/oxidemd-bin/.SRCINFO
          git commit -m "chore: sync Arch PKGBUILDs to ${VERSION}"
          git push -f origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: sync Arch PKGBUILDs to ${VERSION}" \
            --body "Automated PKGBUILD version + checksum sync for the ${VERSION} release. Generated by the release workflow." \
            || echo "A PR for $BRANCH already exists; branch updated."
