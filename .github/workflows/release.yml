name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-24.04
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Tag runs can only read caches from their own ref or the default
      # branch, so a cache saved here is never restorable by a later release:
      # skip the (large) save and only restore the cache CI saves on main
      # under the same shared-key. macOS/Windows miss (key includes the OS)
      # and the restore is a fast no-op there.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: oxidemd
          save-if: false

      - name: Install Node dependencies
        run: npm ci

      # Compose the draft release body from the tag's CHANGELOG.md section
      # (tagline + section + install footer, matching the published releases).
      # Falls back to a bare CHANGELOG link if the section is missing, so a
      # forgotten changelog entry can't fail the release.
      - name: Compose release notes from the changelog
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SECTION="$(awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 {found=1; next}
            /^## \[/ {found=0}
            found' CHANGELOG.md | sed 's/^### /## /')"
          {
            echo "body<<NOTES_EOF"
            if [ -z "${SECTION//[[:space:]]/}" ]; then
              echo "::warning::No CHANGELOG.md section found for ${VERSION}" >&2
              echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for details."
            else
              echo "OxideMD ${VERSION} — a native, browser-free Markdown viewer and editor for Windows, Linux, and macOS."
              echo "$SECTION"
              echo ""
              echo "---"
              echo ""
              echo "**Install:** add the apt/dnf repo from the [install page](https://fenrirthegray.github.io/OxideMD/) for automatic updates, or download the installer for your platform below. See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for full history."
            fi
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "OxideMD v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
