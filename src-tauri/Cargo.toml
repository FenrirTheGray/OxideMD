[package]
name = "oxidemd"
version = "4.13.3"
description = "A lightweight, cross-platform Markdown viewer and editor"
authors = ["Aleksandar Colovic"]
license = "MIT"
repository = "https://github.com/FenrirTheGray/OxideMD"
edition = "2024"
rust-version = "1.85"

[lib]
name = "oxidemd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

pulldown-cmark = { version = "0.13", features = ["simd"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# ponytail: read-only, migrates pre-4.9 config.toml → config.json; drop
# once migrated installs dominate (see config.rs load_legacy_config).
toml = "1"
directories = "6"
open = "5"
base64 = "0.23"
notify = "8"
tempfile = "3"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# Matches the version wry 0.54 already links, so `webview.inner()` hands back
# this crate's WebView type. Used only to reach WebKitSettings (see lib.rs).
webkit2gtk = "2.0.2"
gdk = "0.18"
